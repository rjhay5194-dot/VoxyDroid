          package voxylod.mixin;

          import net.minecraft.client.Camera;
          import net.minecraft.client.DeltaTracker;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.multiplayer.ClientLevel;
          import net.minecraft.client.renderer.fog.FogData;
          import net.minecraft.client.renderer.fog.environment.AtmosphericFogEnvironment;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          import voxylod.VoxyLodMod;

          /** Removes the atmospheric (overworld / nether / end) fog too. Underwater, lava and effect fog are left alone. */
          @Mixin(AtmosphericFogEnvironment.class)
          public class VoxyAtmosphericFogMixin {
              @Inject(at = @At("TAIL"), method = "setupFog(Lnet/minecraft/client/renderer/fog/FogData;Lnet/minecraft/client/Camera;Lnet/minecraft/client/multiplayer/ClientLevel;FLnet/minecraft/client/DeltaTracker;)V")
              public void voxylod$tailSetupFog(FogData fogData, Camera camera, ClientLevel clientLevel, float viewDistance, DeltaTracker deltaTracker, CallbackInfo ci) {
                  if (!VoxyLodMod.fogActive()) return;
                  fogData.environmentalStart = 1e5f;
                  fogData.environmentalEnd = 2e5f;
                  fogData.skyEnd = viewDistance;
                  fogData.cloudEnd = Minecraft.getInstance().options.cloudRange().get() * 16.0f;
              }
