          package voxylod.mixin;

          import net.minecraft.client.renderer.fog.FogData;
          import net.minecraft.client.renderer.fog.FogRenderer;
          import org.objectweb.asm.Opcodes;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Redirect;
          import voxylod.VoxyLodMod;

          /** Pushes the vanilla render-distance fog out of reach while the LOD is on. */
          @Mixin(FogRenderer.class)
          public class VoxyFogRendererMixin {
              @Redirect(method = "setupFog", at = @At(value = "FIELD", target = "Lnet/minecraft/client/renderer/fog/FogData;renderDistanceStart:F", opcode = Opcodes.PUTFIELD))
              private void voxylod$renderDistanceStart(FogData data, float renderDistanceStart) {
                  if (VoxyLodMod.fogActive()) { data.renderDistanceStart = 1e5f; VoxyLodMod.fogHookHits++; }
                  else data.renderDistanceStart = renderDistanceStart;
              }

