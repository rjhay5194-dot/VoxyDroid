              private VoxyLodConfigScreen() {}

              public static Screen build(Screen parent) {
                  VoxyLodMod.Config c = VoxyLodMod.cfg;
                  ConfigBuilder b = ConfigBuilder.create()
                      .setParentScreen(parent)
                      .setTitle(Component.literal("VoxyLod Settings"))
                      .setSavingRunnable(VoxyLodMod::applyConfig);
                  ConfigEntryBuilder eb = b.entryBuilder();
                  ConfigCategory cat = b.getOrCreateCategory(Component.literal("General"));

                  cat.addEntry(eb.startBooleanToggle(Component.literal("Enable LOD"), c.enabled)
                      .setDefaultValue(true)
                      .setTooltip(Component.literal("Turns the LOD terrain on or off. Off frees the GPU memory it uses."))
                      .setSaveConsumer(v -> c.enabled = v)
                      .build());

                  cat.addEntry(eb.startIntSlider(Component.literal("LOD distance (chunks)"), c.distanceChunks, 4, 128)
                      .setDefaultValue(32)
                      .setTooltip(Component.literal("How far the LOD is drawn. Higher uses more memory and GPU time."))
                      .setSaveConsumer(v -> c.distanceChunks = v)
                      .build());

                  cat.addEntry(eb.startIntSlider(Component.literal("Detail bias"), c.detailBias, -1, 2)
                      .setDefaultValue(0)
                      .setTooltip(Component.literal("-1 = sharper detail, 0 = normal, +1/+2 = coarser and cheaper."))
                      .setTextGetter(v -> Component.literal(v < 0 ? "Sharper" : v == 0 ? "Normal" : v == 1 ? "Coarser" : "Coarsest"))
                      .setSaveConsumer(v -> c.detailBias = v)
                      .build());

                  cat.addEntry(eb.startIntSlider(Component.literal("Full detail (chunks beyond vanilla)"), c.fullDetailChunks, 0, 24)
                      .setDefaultValue(6)
                      .setTooltip(Component.literal("How far past vanilla render distance the LOD uses 1 block per voxel. Beyond that it uses 2, 4 and 8 blocks. Higher looks better but costs FPS."))
                      .setSaveConsumer(v -> c.fullDetailChunks = v)
                      .build());

                  cat.addEntry(eb.startIntSlider(Component.literal("Stored depth below surface (blocks)"), c.surfaceDepth, 8, 128)
                      .setDefaultValue(32)
                      .setTooltip(Component.literal("How deep under the surface LOD data is kept. Applies to chunks loaded after you change it."))
                      .setSaveConsumer(v -> c.surfaceDepth = v)
                      .build());

                  cat.addEntry(eb.startBooleanToggle(Component.literal("Remove vanilla fog"), c.disableFog)
                      .setDefaultValue(true)
                      .setTooltip(Component.literal("Turns off vanilla distance fog while the LOD is enabled, so terrain does not fade out before the LOD starts."))
                      .setSaveConsumer(v -> c.disableFog = v)
                      .build());

                  cat.addEntry(eb.startIntSlider(Component.literal("Transition overlap (chunks)"), c.transitionOverlap, 0, 3)
                      .setDefaultValue(1)
                      .setTooltip(Component.literal("LOD is also drawn this many chunks underneath the edge of vanilla terrain, so there is no gap or seam between them. Higher costs FPS."))
                      .setSaveConsumer(v -> c.transitionOverlap = v)
